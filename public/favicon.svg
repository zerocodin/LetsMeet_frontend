  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#brand)"/>
  <rect x="2" y="2" width="60" height="30" rx="14" ry="14" fill="url(#shine)"/>

  <!-- Rounded 4-point spark -->
